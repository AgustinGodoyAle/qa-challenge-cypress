name: Cypress

on: [push, workflow_dispatch]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      # Solo UI: Fake Store API responde 403 a los runners de GitHub (bloqueo por IP),
      # así que los tests de API se corren local con npm run test:api.
      - run: npm run test:ui
